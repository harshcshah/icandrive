<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#FB923C" />
    </linearGradient>
  </defs>
  <!-- Background with rounded squircles -->
  <rect width="512" height="512" rx="112" fill="#0F172A" />
  <circle cx="256" cy="256" r="210" fill="url(#primaryGrad)" fill-opacity="0.15" />
  
  <!-- Outer Steering Rim -->
  <circle cx="256" cy="256" r="168" stroke="url(#primaryGrad)" stroke-width="28" fill="none" />
  
  <!-- Inner Steering Center -->
  <circle cx="256" cy="256" r="56" fill="url(#primaryGrad)" />
  
  <!-- Steering Spokes -->
  <line x1="88" y1="256" x2="200" y2="256" stroke="url(#primaryGrad)" stroke-width="24" stroke-linecap="round" />
  <line x1="312" y1="256" x2="424" y2="256" stroke="url(#primaryGrad)" stroke-width="24" stroke-linecap="round" />
  <line x1="256" y1="312" x2="256" y2="424" stroke="url(#primaryGrad)" stroke-width="24" stroke-linecap="round" />
  
  <!-- Accent Arrow / Forward Road Mark -->
  <path d="M220 256 L256 216 L292 256" stroke="url(#accentGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <circle cx="256" cy="180" r="12" fill="url(#accentGrad)" />
  
  <!-- Stylized road dash -->
  <rect x="246" y="96" width="20" height="36" rx="10" fill="#F8FAFC" opacity="0.85" />
</svg>
